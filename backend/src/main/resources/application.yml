server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: deepaudit-backend
  config:
    import:
      - optional:application-prod.yml
  servlet:
    # T3.1 / plan §6.6: PDF upload cap is 10 MB at the API contract; allow
    # 12 MB at the servlet boundary to leave room for the multipart envelope
    # (boundary headers + form fields). Anything larger is rejected before
    # PDFBox or Gemini sees it.
    multipart:
      max-file-size: 12MB
      max-request-size: 12MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/deepaudit}
    username: ${SPRING_DATASOURCE_USERNAME:deepaudit}
    password: ${SPRING_DATASOURCE_PASSWORD:deepaudit}
    driver-class-name: org.postgresql.Driver
  jpa:
    # Flyway owns DDL. `validate` makes Hibernate compare entity mappings
    # against the live schema at startup -- catches entity/DDL drift early.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    # `enabled: true` and `locations: classpath:db/migration` are Spring
    # Boot defaults; migrations live at
    # backend/src/main/resources/db/migration/V*.sql.
    #
    # baseline-on-migrate / baseline-version handle the "DB already has
    # the V1 tables but no flyway_schema_history" case -- which is
    # exactly the state if you applied V1 manually before Flyway was
    # wired in. With baseline-version=1, the first run on such a DB
    # stamps it as already at V1 (no SQL re-executed) and only future
    # V2/V3 will run. On a truly empty DB, baseline does NOT trigger
    # and V1 runs normally.
    baseline-on-migrate: true
    baseline-version: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true # surfaces JDBC SELECT 1 in actuator/health (Goal success criterion #3)

deepaudit:
  # T3.3: where uploaded PDFs land. Local dev defaults to ./uploads
  # relative to the JVM CWD; docker-compose overrides to /app/uploads
  # which is mounted on a named volume so PDFs survive container
  # restarts (DEEPAUDIT_UPLOAD_DIR env var binds here).
  upload-dir: ${DEEPAUDIT_UPLOAD_DIR:./uploads}
  # ICD-9-CM-3 / ICD-10 dictionary loader.
  # On startup, IcdDictLoader bulk-imports docs/icd_dict/*.jsonl into the
  # icd_dict table when (a) auto-load=true AND (b) the table is empty.
  # Source path is a Spring Resource URL — defaults to classpath since the
  # Maven build mirrors docs/icd_dict/ into classpath:data/icd_dict/.
  icd:
    auto-load: ${DEEPAUDIT_ICD_AUTO_LOAD:true}
    resource-dir: classpath:data/icd_dict
  llm:
    # DeepSeek V3 (OpenAI-compatible API). Chat + streaming share deepseek-chat.
    # DeepSeek has no embedding endpoint; embedding features degrade gracefully.
    # Set DEEPSEEK_API_KEY env var to enable NL->DSL, violation explanation,
    # and testing-assistant. Rule engine itself does NOT require LLM.
    provider: deepseek
    base-url: https://api.deepseek.com/v1
    api-key: ${DEEPSEEK_API_KEY:}
    chat-model: deepseek-chat
    timeout-seconds: 60
    max-retries: 2

logging:
  level:
    root: INFO
    com.deepaudit: DEBUG
