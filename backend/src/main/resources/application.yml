server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: deepaudit-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/deepaudit}
    username: ${SPRING_DATASOURCE_USERNAME:deepaudit}
    password: ${SPRING_DATASOURCE_PASSWORD:deepaudit}
    driver-class-name: org.postgresql.Driver
  jpa:
    # Flyway owns DDL. `validate` makes Hibernate compare entity mappings
    # against the live schema at startup -- catches entity/DDL drift early.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    # `enabled: true` and `locations: classpath:db/migration` are Spring
    # Boot defaults; migrations live at
    # backend/src/main/resources/db/migration/V*.sql.
    #
    # baseline-on-migrate / baseline-version handle the "DB already has
    # the V1 tables but no flyway_schema_history" case -- which is
    # exactly the state if you applied V1 manually before Flyway was
    # wired in. With baseline-version=1, the first run on such a DB
    # stamps it as already at V1 (no SQL re-executed) and only future
    # V2/V3 will run. On a truly empty DB, baseline does NOT trigger
    # and V1 runs normally.
    baseline-on-migrate: true
    baseline-version: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true   # surfaces JDBC SELECT 1 in actuator/health (Goal success criterion #3)

deepaudit:
  llm:
    provider: dashscope
    api-key: ${DASHSCOPE_API_KEY:}
    chat-model: qwen-max
    vision-model: qwen-vl-max
    embedding-model: text-embedding-v3
    timeout-seconds: 60
    max-retries: 2

dashscope:
  data-improvement:
    # C-regulatory-002: this app's policy. The console toggle MUST be OFF.
    # If env DASHSCOPE_DATA_IMPROVEMENT=on, the startup guard logs WARN.
    allowed: false
    detected-state: ${DASHSCOPE_DATA_IMPROVEMENT:off}

logging:
  level:
    root: INFO
    com.deepaudit: DEBUG
