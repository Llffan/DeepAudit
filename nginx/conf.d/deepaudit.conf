server {
    listen 8080;
    server_name _;

    # Use the docker-embedded DNS resolver so `backend` / `frontend` are looked
    # up at REQUEST time (not at nginx -t / config-load time). This is what
    # lets `nginx -t` pass cleanly outside the compose network and also
    # tolerates container restarts that change container IPs. (Replaces the
    # earlier `upstream { server backend:8080; }` blocks which fail isolated
    # nginx -t validation.)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ----- SSE endpoint MUST come before the generic /api/ block -----
    # C-env-004 / R8 defense: SSE stream MUST NOT be buffered by Nginx,
    # otherwise frontend shows nothing until the full message arrives,
    # defeating DoD #6 first-token<3s in Phase 4.
    location ~ ^/api/check-results/[^/]+/explain$ {
        # `set` + variable in proxy_pass forces re-resolution per request
        # via the resolver above. Append $request_uri so the upstream sees
        # the original /api/... path (variable form drops it otherwise).
        set $sse_backend "backend:8080";
        proxy_pass http://$sse_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
        proxy_read_timeout 1h;
    }

    # Backend API (everything under /api/)
    location /api/ {
        set $api_backend "backend:8080";
        proxy_pass http://$api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend SPA
    location / {
        set $frontend_upstream "frontend:80";
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
