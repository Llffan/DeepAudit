server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api proxies to the backend service (docker-compose hostname `backend`)
    # The OUTER nginx (Plan 00.3) is responsible for SSE no-buffer config.
    # This inner proxy is only used if browser is pointed directly at the
    # frontend container; in normal docker-compose it goes via outer nginx.
    #
    # NOTE: backend hostname is resolved at request time (variable in proxy_pass)
    # so that the container starts even when `backend` is not yet up or absent
    # (e.g. running this image standalone without docker-compose).
    resolver 127.0.0.11 ipv6=off valid=10s;
    location /api/ {
        set $backend_upstream "http://backend:8080";
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
