name: deepaudit

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: deepaudit-db
    environment:
      POSTGRES_DB: deepaudit
      POSTGRES_USER: deepaudit
      POSTGRES_PASSWORD: deepaudit
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepaudit -d deepaudit"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: deepaudit-backend:phase0
    container_name: deepaudit-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/deepaudit
      SPRING_DATASOURCE_USERNAME: deepaudit
      SPRING_DATASOURCE_PASSWORD: deepaudit
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -fs http://localhost:8080/api/actuator/health | grep -q ''"status":"UP"'' || exit 1',
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: deepaudit-frontend:phase0
    container_name: deepaudit-frontend
    depends_on:
      backend:
        condition: service_started
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: deepaudit-nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://localhost:8080/api/actuator/health | grep -q ''"status":"UP"'' || exit 1',
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

volumes:
  db_data:
    name: deepaudit_db_data
